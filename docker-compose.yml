services:
  cardcade:
    build: .
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 4380
    ports:
      - "127.0.0.1:${CARDCADE_PORT:-4380}:4380"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4380/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
