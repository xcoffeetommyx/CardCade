    <a class="skip-link" href="#app">Skip to Cardcade</a>
    <div class="site-shell">
      <header class="topbar">
        <button class="brand" type="button" data-action="home" aria-label="Cardcade home">
          <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
          <span><strong>Cardcade</strong></span>
        </button>
        <div class="pwa-tools">
          <button class="install-button" id="install-button" type="button" data-action="install-pwa" hidden>Install app</button>
          <div class="topbar-status" id="network-status"><span class="status-light"></span><span>Online</span></div>
        </div>
      </header>
      <div class="system-banner" id="system-banner" role="status" aria-live="polite" hidden>
        <span class="system-banner-dot" aria-hidden="true"></span>
        <span id="system-banner-message"></span>
        <button type="button" data-action="apply-app-update" hidden>Update</button>
      </div>
      <main id="app" tabindex="-1" aria-live="polite"></main>
      <footer><span>Cardcade platform preview</span><span>One room · many games</span></footer>
